services:
  - type: web
    name: quotex-signal-lab
    env: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && pip install -e . && python -c "import quotexpy; print('quotexpy import OK:', quotexpy.__file__)"
    startCommand: PYTHONPATH=. gunicorn --bind 0.0.0.0:$PORT app:app
